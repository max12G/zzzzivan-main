<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroAPI — Регистрация</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <script src="/static/js/theme.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

    <main class="auth-page">
        <button class="auth-theme theme-toggle" data-theme-toggle aria-label="Включить тёмную тему" title="Тема"><i class="ri-moon-line"></i></button>
        <div class="auth-container">
        <a href="/" class="auth-brand"><span class="auth-brand-icon"><i class="ri-brain-line"></i></span>Neuro<span>API</span></a>
        <div class="auth-header">
            <h2>Создать аккаунт</h2>
            <p>Присоединяйтесь к нам за пару кликов</p>
        </div>

        <div class="auth-body">
            <form action="#" method="post" id="register-form" novalidate>
                <div class="form-group">
                    <label for="fullname">Ваше имя</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Иван Иванов" autocomplete="name" required>
                    <div class="error-msg" id="fullname-error"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.ru" autocomplete="email" required>
                    <div class="error-msg" id="email-error"></div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Не менее 8 символов" autocomplete="new-password" required>
                    <div class="error-msg" id="password-error"></div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Повторите пароль</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Повторите пароль" autocomplete="new-password" required>
                    <div class="error-msg" id="confirm_password-error"></div>
                </div>

                <button type="submit" class="btn btn-success">Зарегистрироваться</button>
            </form>

        </div>
    </div>
    <div class="switch-link">
        Уже есть аккаунт? <a href="/login">Войти</a>
    </div>
    </main>

    <script src="/static/js/script.js"></script>
</body>
</html>
