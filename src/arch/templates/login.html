<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroAPI — Вход</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <script src="/static/js/theme.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

    <main class="auth-page">
        <button class="auth-theme theme-toggle" data-theme-toggle aria-label="Включить тёмную тему" title="Тема"><i class="ri-moon-line"></i></button>
        <div class="auth-container">
        <a href="/" class="auth-brand"><span class="auth-brand-icon"><i class="ri-brain-line"></i></span>Neuro<span>API</span></a>
        <div class="auth-header">
            <h2>Вход в систему</h2>
            <p>Вернитесь к работе</p>
        </div>

        <div class="auth-body">
            <form action="#" method="post" id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Логин или Email</label>
                    <input type="text" id="username" name="username" placeholder="you@example.com" autocomplete="username" required>
                    <div class="error-msg" id="username-error"></div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Введите пароль" autocomplete="current-password" required>
                    <div class="error-msg" id="password-error"></div>
                </div>

                <button type="submit" class="btn btn-primary">Войти</button>
            </form>

        </div>
    </div>
    <div class="switch-link">
        Нет аккаунта? <a href="/">Создать аккаунт</a>
    </div>
    </main>

    <script src="/static/js/script.js"></script>
</body>
</html>
